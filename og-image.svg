<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="roybase · roy 的个人主页与自托管服务导航">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0e14"/>
      <stop offset="100%" stop-color="#111726"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6ee7ff"/>
      <stop offset="100%" stop-color="#8ba9ff"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- decorative grid -->
  <g stroke="#6ee7ff" stroke-opacity="0.07" stroke-width="1">
    <path d="M0 158h1200M0 315h1200M0 472h1200"/>
    <path d="M300 0v630M600 0v630M900 0v630"/>
  </g>

  <!-- terminal window -->
  <g transform="translate(80,120)">
    <rect width="1040" height="390" rx="18" fill="#0d1320" stroke="#6ee7ff" stroke-opacity="0.28" stroke-width="2"/>
    <rect width="1040" height="52" rx="18" fill="#0a111e"/>
    <rect y="34" width="1040" height="18" fill="#0a111e"/>
    <line x1="0" y1="52" x2="1040" y2="52" stroke="#6ee7ff" stroke-opacity="0.18"/>
    <circle cx="34" cy="26" r="8" fill="#ff5f57"/>
    <circle cx="62" cy="26" r="8" fill="#febc2e"/>
    <circle cx="90" cy="26" r="8" fill="#28c840"/>
    <text x="128" y="33" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="18" fill="#7c8aa5">roy@roybase: ~</text>

    <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="26">
      <text x="42" y="112" fill="#6ee7ff">roy@roybase:~$</text>
      <text x="300" y="112" fill="#e6edf7">echo "你好，我是 roy"</text>
      <text x="42" y="158" fill="#e6edf7">把能自托管的</text>
      <text x="42" y="204" fill="#e6edf7">都自托管了</text>
      <rect x="238" y="186" width="16" height="30" fill="#6ee7ff"/>
    </g>

    <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="20" fill="#8b98ad">
      <text x="42" y="268">// 17 个自托管服务 · jdcloud / aipc / nas</text>
      <text x="42" y="308">// 工具导航 · 折腾日志 · 技术收藏</text>
      <text x="42" y="348">$ <tspan fill="#6ee7ff">_</tspan></text>
    </g>
  </g>

  <!-- brand -->
  <text x="80" y="84" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="40" font-weight="700" fill="url(#accent)">roy@roybase</text>
  <text x="1120" y="84" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="24" fill="#7c8aa5">www.roybase.top</text>
  <rect x="80" y="560" width="120" height="8" rx="4" fill="#ffb86b"/>
</svg>